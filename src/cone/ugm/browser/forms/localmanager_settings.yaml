factory: form
name: localmanager_settings
props:
    action: context.form_action
    class: ajax
widgets:
- rules:
    factory: field:array
    value: expr:context.rules_value
    props:
        label: i18n:localmanager_rules
        sort: False
        class_add: mb-3
        # No green border and check mark on what passed after a submit -
        # here and on every widget below (bootstrap ``is-valid``)
        valid_class: False
    widgets:
    - rule:
        factory: error:*duplicate_rule:compound
        custom:
            duplicate_rule:
                extractors:
                    - context.duplicate_rule
        widgets:
        - source:
            factory: field:label:error:autocomplete
            props:
                label: i18n:localmanager_rule_source
                required: i18n:localmanager_source_empty
                source: expr:context.group_id_vocab_url
                keys: True
                lookup: context.group_title
                minLength: 1
                delay: 300
                valid_class: False
                field.class_add: col-12 col-md-6 p-0
        - targets:
            factory: field:error:array
            props:
                label: i18n:localmanager_rule_target
                required: i18n:localmanager_no_targets_for_source
                error.position: after
                sort: False
                valid_class: False
                # The gap to the source on the field, not on the array: the
                # message of an empty array renders after the array inside
                # the field, and has to start where the array starts
                field.class_add: col-12 col-md-6 mt-md-4 p-0 ps-md-3
                array.class_add: mt-md-2
            widgets:
            # One input group, ``[group    ][x]``: the group and the flag
            # whether it is a default one. Checked on the entry, so a
            # missing or wrong group is said below the group rather than
            # inside it, where it pushed the checkbox onto a line of its own.
            - target:
                factory: error:*target:compound
                custom:
                    target:
                        extractors:
                            - context.target_gid_required
                            - context.target_not_source
                widgets:
                - group:
                    factory: div
                    props:
                        structural: True
                        class: input-group flex-nowrap
                    widgets:
                    - gid:
                        factory: autocomplete
                        props:
                            source: expr:context.group_id_vocab_url
                            keys: True
                            lookup: context.group_title
                            minLength: 1
                            delay: 300
                            valid_class: False
                    - default_wrapper:
                        factory: div
                        props:
                            structural: True
                            class: input-group-text
                        widgets:
                        - default:
                            factory: checkbox
                            props:
                                class: form-check-input mt-0 target_default
                                title: i18n:localmanager_target_default:Default group
                                valid_class: False
- save:
    factory: submit
    props:
        action: save
        expression: True
        handler: context.save
        next: context.next
        label: i18n:save